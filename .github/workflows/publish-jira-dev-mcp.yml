name: Publish jira-dev-mcp to npm

on:
  push:
    tags:
      - 'jira-dev-mcp-v*'   # e.g. jira-dev-mcp-v1.4.7

defaults:
  run:
    working-directory: mcps/jira-dev-mcp

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"               # jira-dev-mcp-v1.4.7
          VERSION="${TAG##*-v}"                  # 1.4.7
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Bump version from tag
        run: npm version ${{ steps.meta.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Generate built-in credentials
        run: node scripts/generate-defaults.js
        env:
          JIRA_CLIENT_ID_BUILTIN: ${{ secrets.JIRA_CLIENT_ID }}
          JIRA_CLIENT_SECRET_BUILTIN: ${{ secrets.JIRA_CLIENT_SECRET }}

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
